name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Validate release identity and branding
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^appVersion = "1.0.2"$' gradle/libs.versions.toml
          grep -q '^appVersionCode = "102"$' gradle/libs.versions.toml
          if git grep -n -i -E 'teledrive|tele drive|dr\.disagree|mpv∞|mpvinfinity' -- ':!.github/workflows/release.yml'; then
            echo "Legacy branding found in tracked source."
            exit 1
          fi

      - name: Prepare Android signing keystore
        shell: bash
        run: |
          set -euo pipefail
          test -n "${{ secrets.DRIVE_KEYSTORE_B64 }}"
          echo "${{ secrets.DRIVE_KEYSTORE_B64 }}" | base64 --decode > "$RUNNER_TEMP/drive-infinity-release.jks"
          chmod 600 "$RUNNER_TEMP/drive-infinity-release.jks"

      - name: Build FFmpeg audio decoder
        uses: ./.github/actions/build-ffmpeg-decoder

      - name: Assemble release APKs
        run: ./gradlew :android:assembleRelease -PwithFfmpegDecoder
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/drive-infinity-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.DRIVE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DRIVE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DRIVE_KEY_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: android/build/outputs/apk/release/*.apk
          if-no-files-found: error

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache VLC natives
        uses: actions/cache@v4
        with:
          path: desktop/build/vlc
          key: vlc-natives-${{ hashFiles('desktop/build.gradle.kts') }}

      - name: Package installer
        run: ./gradlew :desktop:packageMsi

      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: desktop/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error

  linux:
    name: Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Package Debian installer + AppImage
        run: ./gradlew :desktop:packageDeb :desktop:buildAppImage --no-configuration-cache

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}-release
          path: |
            desktop/build/compose/binaries/main/deb/*.deb
            desktop/build/compose/binaries/main/appimage/*.AppImage
          if-no-files-found: error

  publish:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: [android, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Flatten package files for release upload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-files
          # Android APKs and Windows MSI land at the artifact root
          find artifacts -type f \( -name '*.apk' -o -name '*.msi' \) -print -exec cp -n {} release-files/ \;
          # Linux packages keep deb/ and appimage/ subdirs from upload-artifact
          find artifacts -type f \( -name '*.deb' -o -name '*.AppImage' -o -name '*.appimage' \) -print -exec cp -n {} release-files/ \;
          echo "--- release-files ---"
          ls -lah release-files
          test -n "$(find release-files -name '*.apk' | head -1)"
          test -n "$(find release-files -name '*.msi' | head -1)"
          test -n "$(find release-files -name '*.deb' | head -1)"
          test -n "$(find release-files \( -name '*.AppImage' -o -name '*.appimage' \) | head -1)"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.2
          draft: false
          name: Drive∞ v1.0.2
          generate_release_notes: false
          body: |
            ## Drive∞ v1.0.2

            Drive∞ v1.0.2 is a stability and packaging release with refined desktop and Android builds.

            ### Improvements
            - 🛡️ More reliable Telegram client natives selection for desktop packaging targets
            - 📦 Updated desktop packaging pipeline for multi-architecture installers
            - 🔧 Version bump across in-app version display and package metadata (1.0.2 / 102)

            ### Bug fixes and stability
            - ✅ Fixed missing native library load path issues for ARM64 desktop builds
            - ✅ Hardened Gradle configuration-cache compatibility for AppImage packaging tasks

            ### Downloads
            - Android release APKs for all configured ABIs
            - Windows MSI installer
            - Desktop Deb packages
            - Desktop AppImage packages
          files: release-files/*
