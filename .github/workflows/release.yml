name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Validate release identity and branding
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep '^appVersion = ' gradle/libs.versions.toml | cut -d'"'"' -f2)" = "1.0.0"
          test "$(grep '^appVersionCode = ' gradle/libs.versions.toml | cut -d'"'"' -f2)" = "100"
          if git grep -n -i -E 'teledrive|tele drive|dr\.disagree|mpv∞|mpvinfinity'; then
            echo "Legacy branding found in tracked source."
            exit 1
          fi

      - name: Prepare Android signing keystore
        shell: bash
        run: |
          set -euo pipefail
          test -n "${{ secrets.DRIVE_KEYSTORE_B64 }}"
          echo "${{ secrets.DRIVE_KEYSTORE_B64 }}" | base64 --decode > "$RUNNER_TEMP/drive-infinity-release.jks"
          chmod 600 "$RUNNER_TEMP/drive-infinity-release.jks"

      - name: Build FFmpeg audio decoder
        uses: ./.github/actions/build-ffmpeg-decoder

      - name: Assemble release APKs
        run: ./gradlew :android:assembleRelease -PwithFfmpegDecoder
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/drive-infinity-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.DRIVE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DRIVE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DRIVE_KEY_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: android/build/outputs/apk/release/*.apk
          if-no-files-found: error

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache VLC natives
        uses: actions/cache@v4
        with:
          path: desktop/build/vlc
          key: vlc-natives-${{ hashFiles('desktop/build.gradle.kts') }}

      - name: Package installer
        run: ./gradlew :desktop:packageMsi

      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: desktop/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error

  publish:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: DriveInfinity v1.0.0
          generate_release_notes: false
          body: |
            ## DriveInfinity v1.0.0

            DriveInfinity v1.0.0 brings a smoother, stronger, and more polished experience for cloud storage, uploads, downloads, and everyday file management.

            ### Major improvements
            - 🌑 AMOLED theme with a true-black interface for comfortable viewing and battery-friendly dark mode.
            - ☁️ More dependable large-file uploads and downloads with stronger pause, resume, retry, and transfer recovery behavior.
            - 📁 Complete folder uploads with nested files, preserved folder structure, and support for empty files.
            - 📊 Clearer transfer progress with upload/download status, transfer history, queue information, and chunk details for large files.
            - 🏠 A richer home dashboard with active uploads, queue statistics, recent files, storage usage, and backup information.
            - 💾 More informative storage views with file-type visibility for images, video, audio, documents, archives, and other files.
            - 🎨 A more polished interface across storage channels, transfer cards, history sections, navigation, spacing, and progress presentation.
            - 🖼️ Improved app icon presentation across the launcher, About page, and application surfaces.
            - 🔄 GitHub-based in-app update checking through the DriveInfinity release channel.

            ### Downloads
            - Android release APKs
            - Windows MSI installer
          files: |
            artifacts/*.apk
            artifacts/*.msi
