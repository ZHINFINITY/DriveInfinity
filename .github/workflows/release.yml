name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build FFmpeg audio decoder
        uses: ./.github/actions/build-ffmpeg-decoder

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE }}" | base64 -d > "$RUNNER_TEMP/keystore.jks"

      - name: Assemble signed release APKs
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :android:assembleRelease -PwithFfmpegDecoder

      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: android/build/outputs/apk/release/*.apk
          if-no-files-found: error

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache VLC natives
        uses: actions/cache@v4
        with:
          path: desktop/build/vlc
          key: vlc-natives-${{ hashFiles('desktop/build.gradle.kts') }}

      - name: Package installer
        run: ./gradlew :desktop:packageMsi

      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: desktop/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error

  publish:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: DriveInfinity v1.0.0
          generate_release_notes: false
          body: |
            ## DriveInfinity v1.0.0

            This release makes DriveInfinity more reliable, clearer to use, and stronger for long-running cloud uploads.

            ### Highlights
            - Added AMOLED theme support with a true-black palette.
            - Fixed the About page crash and removed inherited links from the original project.
            - Added DriveInfinity GitHub and Ko-fi links in About.
            - Improved whole-folder uploads, including nested files and zero-byte files.
            - Made pause/resume and large-file transfers more resilient with stall recovery and persistent progress recovery.
            - Added a richer home dashboard with upload, queue, storage, and recent-file information.
            - Improved transfer cards, history sections, navigation styling, and spacing to prevent overlap.
            - Added chunk progress details below upload progress bars for large files.
            - Improved storage category visibility for images, video, audio, documents, archives, and other files.
            - Fixed launcher icon sizing and About icon rendering.

            ### Downloads
            - Android release APKs
            - Windows MSI installer
          files: |
            artifacts/*.apk
            artifacts/*.msi
