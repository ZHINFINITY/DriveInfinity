name: Build

on:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - "**.yml"
      - LICENSE
      - .github/screenshots/**
  pull_request:
    paths-ignore:
      - "**.md"
      - "**.yml"
      - LICENSE
      - .github/screenshots/**
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build FFmpeg audio decoder
        uses: ./.github/actions/build-ffmpeg-decoder

      - name: Assemble debug APKs
        run: ./gradlew :android:assembleDebug -PwithFfmpegDecoder

      - uses: actions/upload-artifact@v4
        with:
          name: DriveInfinity-arm64-v8a
          path: android/build/outputs/apk/debug/*-arm64-v8a-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: DriveInfinity-armeabi-v7a
          path: android/build/outputs/apk/debug/*-armeabi-v7a-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: DriveInfinity-x86_64
          path: android/build/outputs/apk/debug/*-x86_64-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: DriveInfinity-x86
          path: android/build/outputs/apk/debug/*-x86-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: DriveInfinity-universal
          path: android/build/outputs/apk/debug/*-universal-debug.apk
          if-no-files-found: error

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Desktop tests
        run: ./gradlew :desktop:test

      - name: Cache VLC natives
        uses: actions/cache@v4
        with:
          path: desktop/build/vlc
          key: vlc-natives-${{ hashFiles('desktop/build.gradle.kts') }}

      - name: Package installer
        run: ./gradlew :desktop:packageMsi

      - uses: actions/upload-artifact@v4
        with:
          name: DriveInfinity-windows
          path: desktop/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error
