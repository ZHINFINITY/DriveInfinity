name: Linux aarch64

on:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - LICENSE
      - .github/screenshots/**
  workflow_dispatch:

concurrency:
  group: linux-aarch64-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux-aarch64:
    name: Linux aarch64 (Deb + AppImage)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Package Debian + AppImage
        run: ./gradlew :desktop:packageDeb :desktop:buildAppImage --no-configuration-cache

      - uses: actions/upload-artifact@v4
        with:
          name: linux-aarch64-release
          path: |
            desktop/build/compose/binaries/main/deb/*.deb
            desktop/build/compose/binaries/main/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 14
