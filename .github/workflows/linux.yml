name: Linux

on:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - LICENSE
      - .github/screenshots/**
  workflow_dispatch:

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: Linux ${{ matrix.arch }} (Deb + AppImage)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Package Debian + AppImage (${{ matrix.arch }})
        run: ./gradlew :desktop:packageDeb :desktop:buildAppImage --no-configuration-cache

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}-release
          path: |
            desktop/build/compose/binaries/main/deb/*.deb
            desktop/build/compose/binaries/main/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 14
