name: Drive∞ ARM64 APK

on:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - "**.yml"
      - LICENSE
      - .github/screenshots/**
  workflow_dispatch:

concurrency:
  group: drive-infinity-arm64-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-arm64:
    name: Android ARM64-v8a
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build FFmpeg audio decoder
        uses: ./.github/actions/build-ffmpeg-decoder

      - name: Assemble ARM64-v8a APK
        run: ./gradlew :android:assembleDebug -PtargetAbi=arm64-v8a -PwithFfmpegDecoder --no-daemon

      - name: Upload Drive∞ ARM64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: DriveInfinity-arm64-v8a-debug
          path: android/build/outputs/apk/debug/*-arm64-v8a-debug.apk
          if-no-files-found: error
          retention-days: 14
